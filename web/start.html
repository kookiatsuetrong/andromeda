<!DOCTYPE html>
<html>
	<head>
		<meta name="viewport" content="width=device-width" />
		<title>Start</title>
		<link rel="stylesheet" href="/normalize.css" />
	</head>
	
	<body>
		<section class="background"></section>
	</body>
	
	<style>
		* {
			outline: none;
		}
		body {
			margin: 0; 
			padding: 0; 
			border: none; 
			font-family: sans-serif;
			background-color: #fff386;
			
			font-size: 1rem;
			min-height: 100dvh;
			overflow: hidden;
			
			/*
			background: linear-gradient(45deg, 
					rgba(20%, 30%, 99%,  1), 
					rgba( 0%, 99%, 70%,  .9));
			background: linear-gradient(200deg, 
					rgba( 0%, 50%, 99%, .75), 
					rgba(50%,  0%, 99%, .75));
			background: linear-gradient(45deg, 
					rgba(20%, 99%, 80%, .75), 
					rgba( 0%, 20%, 99%, .70),
					rgba(99%, 10%, 40%, .80));
			*/
			
			background:	linear-gradient(70deg, 
							rgba(  0%, 20%, 99%, .40) 10%, 
							rgba(  0%, 99%, 30%, .30),
							rgba( 99%, 90%, 20%, .30),
							rgba( 99%,  0%,  0%, .40)
						);
		}
		.background {
			width: 100dvw;
			height: 100dvh;
			background-image: url("/background-gray.png");
			background-size: cover;
		}
		a {
			text-decoration: none;
			color: #aaa;
		}
		a:visited {
			color: #aaa;
		}
		a:hover {
			color: #333;
			cursor: pointer;
		}
		
		button {
			background: #ccc;
			color: #333;
			border: .1rem solid #aaa;
			padding: .5rem 1rem;
			border-radius: .35rem;
		}
		button:hover {
			background: #eee;
		}
		button:active {
			border: .1rem solid #ddd;
		}
		
	</style>
	
	<script src="/andromeda.js"></script>
	
	<script>
		window.addEventListener("load", e => {
			Screen.registerApp("Empty",        createEmptyApp    )
			Screen.registerApp("Photo Viewer", createPhotoViewer )
			Screen.registerApp("Currency",     createCurrency    )
			Screen.registerApp("Sample",       createSampleApp   )
			Screen.registerApp("Text Editor",  e => createTextEditor(e)  )

			Screen.associate("Text Editor",  "text/plain")
			Screen.associate("Photo Viewer", "image/jpg" )
			Screen.associate("Photo Viewer", "image/jpeg")
			Screen.associate("Photo Viewer", "image/png" )
			
			Screen.setIcon("Text Editor",  Screen.documentIcon)
			Screen.setIcon("Photo Viewer", Screen.photoIcon)
			Screen.setIcon("Currency",     Screen.signalIcon)
		})
		
		function createTextEditor(file) {
			var main = Screen.createWindow("Text Editor")
			
			// remove current container
			var container = main.element.querySelector(".container")
			main.element.removeChild(container)
			
			// use textarea as the container

			var editor = document.createElement("textarea")
			// editor.style.background = "#eef"
			editor.style.display = "block"
			editor.style.padding = ".75rem"
			editor.style.margin  = 0
			editor.style.border  = "none"
			editor.style.resize  = "none"
			editor.style.width   = "calc(100% - 1.50rem)"
			editor.style.height  = "calc(100% - 3.50rem)"
			editor.style.fontSize   = "1rem"
			editor.style.fontFamily = "roboto-mono, monospace"
			
			editor.spellcheck = false
			editor.focus()
			
			editor.style.tabSize = 4
			editor.addEventListener("keydown", e => {
				if (e.key == "Tab") {
					e.preventDefault()
					editor.setRangeText("\t", 
						editor.selectionStart, 
						editor.selectionEnd, "end")
				}
			})
			
			var reader = new FileReader()
			reader.onload = function() {
				console.log(reader.result)
				editor.value = reader.result
			}
			reader.readAsText(file)
			
			main.element.appendChild(editor)
		}
		
		function createEmptyApp() {
			var main = Screen.createWindow("Minimal")
		}
		
		function createPhotoViewer(file) {
			var reader = new FileReader()
			reader.onload = function() {

				var viewer = Screen.createWindow("Photo Viewer")
				var container = viewer.element.querySelector(".container")
				container.style.padding = 0

				var image = document.createElement("img")
				image.onload = function() {
					console.log(image.height)

					var viewerHeight = viewer.element.clientHeight
					console.log("viewerHeight " + viewerHeight)
					if (viewerHeight > image.height) {
						var value = "calc(" + image.height + "px " +
										"+ 2rem)"
						console.log(value)
						viewer.element.style.height = value
					}
				}
				image.src = reader.result
				image.style.display = "block"
				image.style.width   = "100%"

				Screen.addElement(viewer, image)
			}
			reader.readAsDataURL(file)
		}
		
		/*
		function createPhotoViewer() {
			var viewer = Screen.createWindow("Photo Viewer")
			var container = viewer.element.querySelector(".container")
			container.style.padding = 0
			
			var image = document.createElement("img")
			image.src = "/sample-photo.jpg"
			image.style.display = "block"
			image.style.width   = "100%"
			
			Screen.addElement(viewer, image)
		}
		*/
		
		function createCurrency() {
			var main = Screen.createWindow("Currency")
			var container = main.element.querySelector(".container")
			container.classList.add("cryptocurrency")
			
			var css = `
						.cryptocurrency .list {
							padding: .25rem 0;
							border-bottom: .25rem solid #f8f8f8;
							font-family: monospace;
							font-size: 1.5rem;
						}
						.cryptocurrency .light {
							color: #bbb;
							margin-left: 4rem;
						}
					`
		
			Screen.addStyle(css)
			
			var items = ["BTC-USD", "ETH-USD", "XAU-USD",
						"GBP-USD", "EUR-USD", "USD-JPY", 
						"USD-CHF", "USD-CAD", "AUD-USD",
						"USD-THB"]
			
			for (var i = 0; i < items.length; i++) {
				var list = document.createElement("section")
				list.classList.add("list")
				list.classList.add(items[i])
				list.innerHTML = items[i]
				
				var location = "https://api.coinbase.com" +
								"/v2/prices/" + items[i] + "/spot"
				fetch(location).then( e => e.json() ).then(e => {
					console.log(e)
					var symbol   = e.data.base + "-" + e.data.currency
					var selector = "." + symbol
					var element  = container.querySelector(selector)
					var value    = (+e.data.amount).toFixed(2)
					element.innerHTML = symbol +
										"<span class='light'>" +
										value +
										"</span>"
				})

				Screen.addElement(main, list)
			}
		}
		
		function createSampleApp() {
			var main = Screen.createWindow("Sample")
			var button = document.createElement("button")
			button.innerText = "Test"
			button.addEventListener("click", testDialog)
			Screen.addElement(main, button)
		}
		
		async function testDialog(e) {
			console.log(e)
			var result = await Screen.createDialog("Hello World")
			console.log("result = " + result)
		}
		
	</script>
</html>
