<!DOCTYPE html>
<html>
	<head>
		<meta name="viewport" content="width=device-width" />
		<title>Start</title>
		<link rel="stylesheet" href="/normalize.css" />
	</head>
	
	<body>
		<section class="background"></section>
	</body>
	
	<style>
		* {
			outline: none;
		}
		body {
			margin: 0; 
			padding: 0; 
			border: none; 
			font-family: sans-serif;
			background-color: #fff386;
			
			font-size: 1rem;
			min-height: 100dvh;
			overflow: hidden;
			
			/*
			background: linear-gradient(45deg, 
					rgba(20%, 30%, 99%,  1), 
					rgba( 0%, 99%, 70%,  .9));
			background: linear-gradient(200deg, 
					rgba( 0%, 50%, 99%, .75), 
					rgba(50%,  0%, 99%, .75));
			background: linear-gradient(45deg, 
					rgba(20%, 99%, 80%, .75), 
					rgba( 0%, 20%, 99%, .70),
					rgba(99%, 10%, 40%, .80));
			*/
			
			background:	linear-gradient(70deg, 
							rgba(  0%, 20%, 99%, .40) 10%, 
							rgba(  0%, 99%, 30%, .30),
							rgba( 99%, 90%, 20%, .30),
							rgba( 99%,  0%,  0%, .40)
						);
		}
	</style>
	
	<script src="/andromeda.js"></script>
	
	<script>
		window.addEventListener("load", e => {
			Screen.registerApp("Empty",        createEmptyApp    )
			Screen.registerApp("Photo Viewer", createPhotoViewer )
			Screen.registerApp("Currency",     createCurrency    )
			Screen.registerApp("Sample",       createSampleApp   )
			Screen.registerApp("Text Editor",  e => createTextEditor(e) )
			Screen.registerApp("Memo",         e => createMemoApp(e)    )

			Screen.associate("Text Editor",  "text/plain")
			Screen.associate("Photo Viewer", "image/jpg" )
			Screen.associate("Photo Viewer", "image/jpeg")
			Screen.associate("Photo Viewer", "image/png" )
			
			Screen.setIcon("Text Editor",  Icon.documentIcon)
			Screen.setIcon("Photo Viewer", Icon.photoIcon)
			Screen.setIcon("Currency",     Icon.signalIcon)
			
		})
		
		function createMemoApp(file) {
			var main = Screen.createWindow("Memo")
			
			Screen.addMenu(main, "Download", e => {
				var content = main.element.querySelectorAll(".container > *")
				console.log(content)
				for (var c of content) {
					if (c.tagName == "TEXTAREA") {
						console.log(c.value)
					}
					if (c.tagName == "CANVAS") {
						console.log("a canvas")
					}
				}
			})
			
			Screen.addMenu(main, "Text", e => {
				var editor = document.createElement("textarea")
				editor.style.display    = "block"
				editor.style.padding    = ".75rem"
				editor.style.margin     = "0 0 .5rem 0"
				editor.style.border     = "none"
				editor.style.boxShadow  = "0 0 .1rem #ddd"
				
				editor.style.resize     = "none"
				editor.style.overflow   = "hidden"
				editor.style.width      = "calc(100% - 1.50rem)"
				editor.style.height     = "2rem"
				editor.style.lineHeight = "1.5rem"
				editor.style.fontSize   = "1rem"
				editor.style.fontFamily = "roboto-mono, sarabun, monospace"
				
				editor.style.borderRadius = ".5rem"

				editor.spellcheck = false
				editor.autofocus = true
				editor.focus()
				
				Screen.addElement(main, editor)
				
				editor.addEventListener("keyup", e => {
					var text = editor.value
					var lines = text.split("\n")
					var result = window.getComputedStyle(editor)					
					var h = parseInt(result.lineHeight) * lines.length
					h += 12
					editor.style.height = h + "px"
				})
			})
			
			Screen.addMenu(main, "Drawing", e => {
				var bound = main.element.getBoundingClientRect()
				
				var canvas = document.createElement("canvas")
				canvas.width = bound.width - 40
				canvas.height = "400"
				
				canvas.style.display    = "block"
				canvas.style.background = "#f8f8f8"
				canvas.style.margin     = "0 0 .5rem 0"
				canvas.style.border     = "none"
				canvas.style.boxShadow  = "0 0 .1rem #ddd"
				// canvas.style.width      = "calc(100% - .125rem)"
				canvas.style.width      = canvas.width + "px"
				canvas.style.height     = "400px"
				canvas.style.borderRadius = ".75rem"
				canvas.style.touchAction  = "none"
				canvas.style.userSelect   = "none"
				
				Screen.addElement(main, canvas)				
				
				var resizeObserver = new ResizeObserver( e => {
					console.log("Resizing")
					console.log(e[0].contentRect)
					canvas.width = e[0].contentRect.width - 24
					canvas.style.width = canvas.width + "px"
				})
				resizeObserver.observe(main.element)
				
				var points = [ ]
				var ctx = canvas.getContext("2d")

				canvas.addEventListener("pointerdown", 
					function handleStart(event) {
						// console.log(event)
						// console.log(event.pointerType)
						// console.log(event.pressure)

						// try event.tiltX, event.tiltY
						// try event.pressure

						// event.preventDefault()
						// event.stopPropagation()

						if (event.pointerType == "pen") {
							event.preventDefault()
							// canvas.setPointerCapture(event.pointerId)
							// var bound = canvas.getBoundingClientRect()

							if (event.pressure >= 0.05) {
								var width = 3.25 * event.pressure
								if (width <= 1) width = 1

								var p = { }
								p.x = event.offsetX
								p.y = event.offsetY
								points.push(p)
						   }
						}
					})
				
				canvas.addEventListener("pointermove", 
					function handleMove(event) {		
						// event.preventDefault()
						// event.stopPropagation()

						if (event.pointerType == "pen") {
							event.preventDefault()
							// var bound = canvas.getBoundingClientRect()

							if (event.pressure > 0.05) {
								var p = { }
								p.x = event.offsetX
								p.y = event.offsetY
								points.push(p)

								if (points.length > 1) {
									var last = points[points.length - 2]
									ctx.beginPath()
									ctx.moveTo(last.x, last.y)
									ctx.lineTo(p.x, p.y)
									ctx.lineWidth = 4.0 * event.pressure
									ctx.strokeStyle = "rgba(10%,10%,99%,0.75)"
									ctx.stroke()
								}
							}
						}
					})
				
				canvas.addEventListener("pointerup",  
					function handleFinish(event) {

						// event.preventDefault()
						// event.stopPropagation()

						if (event.pointerType == "pen") {
							event.preventDefault()
							// canvas.releasePointerCapture(event.pointerId)

							if (points.length == 1) {
								var p = points[0]
								var width = 2.75
								ctx.beginPath()
								ctx.arc(p.x, p.y, width, 0, 2 * Math.PI)
								ctx.fillStyle = "rgba(10%, 10%, 99%, 0.75)"
								ctx.fill()
							}
							points = [ ]
						}

						if (window.getSelection()) {
							window.getSelection().removeAllRanges()
						}
					})
			})
		}
		
		function createTextEditor(file) {
			var main = Screen.createWindow("Text Editor")
			
			// remove existing container
			var container = main.element.querySelector(".container")
			main.element.removeChild(container)
			
			// use textarea as the container
			var editor = document.createElement("textarea")
			editor.style.display    = "block"
			editor.style.padding    = ".75rem"
			editor.style.margin     = 0
			editor.style.border     = "none"
			editor.style.resize     = "none"
			editor.style.width      = "calc(100% - 1.50rem)"
			editor.style.height     = "calc(100% - 3.50rem)"
			editor.style.lineHeight = "1.5rem"
			editor.style.fontSize   = "1rem"
			editor.style.fontFamily = "roboto-mono, sarabun, monospace"
			
			editor.spellcheck = false
			editor.focus()
			
			editor.style.tabSize = 4
			editor.addEventListener("keydown", e => {
				if (e.key == "Tab") {
					e.preventDefault()
					editor.setRangeText("\t", 
						editor.selectionStart, 
						editor.selectionEnd, "end")
				}
			})
			
			var originalFileName = ""
			
			if (file instanceof File) {
				console.log(file)
				originalFileName = file.name
				var reader = new FileReader()
				reader.onload = function() {
					editor.value = reader.result
				}
				reader.readAsText(file)
			}
			
			Screen.addMenu(main, "Download", e => {
				var text = editor.value
				text = encodeURIComponent(text)
				var data = "data:text/plain;charset=utf-8," + text
				
				var link = document.createElement("a")
				if (originalFileName == "") {
					originalFileName = "sample.txt"
				}
				link.download = originalFileName
				link.href = data
				link.click()
			})
			
			/*
			Screen.addMenu(main, "Save", e => {
				console.log(e)
			})
			*/
			
			main.element.appendChild(editor)
		}
		
		function createEmptyApp() {
			var main = Screen.createWindow("Minimal")
		}
		
		function createPhotoViewer(file) {

			var viewer = Screen.createWindow("Photo Viewer")
			var container = viewer.element.querySelector(".container")
			container.style.padding = 0
			container.style.height = "calc(100% - 2rem)"

			var image = document.createElement("img")
			image.style.display = "block"
			image.style.width   = "100%"

			Screen.addElement(viewer, image)

			if (file instanceof File) {
				var reader = new FileReader()
				reader.onload = function() {

					image.onload = function() {
						console.log(image.height)

						var viewerHeight = viewer.element.clientHeight
						console.log("viewerHeight " + viewerHeight)
						if (viewerHeight > image.height) {
							var value = "calc(" + image.height + "px " +
											"+ 2rem)"
							console.log(value)
							viewer.element.style.height = value
						}
					}
					image.src = reader.result
					Screen.addElement(viewer, image)
				}
				reader.readAsDataURL(file)
			}
		}
		
		function createCurrency() {
			var main = Screen.createWindow("Currency")
			var container = main.element.querySelector(".container")
			container.classList.add("cryptocurrency")
			
			var css = `
						.cryptocurrency .list {
							padding: .25rem 0;
							border-bottom: .25rem solid #f8f8f8;
							font-family: monospace;
							font-size: 1.5rem;
						}
						.cryptocurrency .light {
							color: #bbb;
							margin-left: 4rem;
						}
					`
		
			Screen.addStyle(css)
			
			var items = ["BTC-USD", "ETH-USD", "XAU-USD",
						"GBP-USD", "EUR-USD", "USD-JPY", 
						"USD-CHF", "USD-CAD", "AUD-USD",
						"USD-THB"]
			
			for (var i = 0; i < items.length; i++) {
				var list = document.createElement("section")
				list.classList.add("list")
				list.classList.add(items[i])
				list.innerHTML = items[i]
				
				var location = "https://api.coinbase.com" +
								"/v2/prices/" + items[i] + "/spot"
				fetch(location).then( e => e.json() ).then(e => {
					// console.log(e)
					var symbol   = e.data.base + "-" + e.data.currency
					var selector = "." + symbol
					var element  = container.querySelector(selector)
					var value    = (+e.data.amount).toFixed(2)
					element.innerHTML = symbol +
										"<span class='light'>" +
										value +
										"</span>"
				})

				Screen.addElement(main, list)
			}
		}
		
		function createSampleApp() {
			var main = Screen.createWindow("Sample")
			var button = document.createElement("button")
			button.innerText = "Test"
			button.addEventListener("click", testDialog)
			Screen.addElement(main, button)
		}
		
		async function testDialog(e) {
			console.log(e)
			var result = await Screen.createDialog("Hello World")
			console.log("result = " + result)
		}
		
	</script>
</html>
