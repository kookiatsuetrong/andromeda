<!DOCTYPE html>
<html>
	<head>
		<meta name="viewport" content="width=device-width" />
		<title>Desktop</title>
		<link rel="stylesheet" href="/normalize.css" />
	</head>
	
	<body>
		<section class="background"></section>
	</body>
	
	<style>
		* {
			outline: none;
		}
		body {
			margin: 0; 
			padding: 0; 
			border: none; 
			font-family: sans-serif;
			background-color: #fff386;
			
			font-size: 1rem;
			min-height: 100dvh;
			overflow: hidden;
			
			/*
			background: linear-gradient(45deg, 
					rgba(20%, 30%, 99%,  1), 
					rgba( 0%, 99%, 70%,  .9));
			background: linear-gradient(200deg, 
					rgba( 0%, 50%, 99%, .75), 
					rgba(50%,  0%, 99%, .75));
			background: linear-gradient(45deg, 
					rgba(20%, 99%, 80%, .75), 
					rgba( 0%, 20%, 99%, .70),
					rgba(99%, 10%, 40%, .80));
			*/
			
			background:	linear-gradient(70deg, 
							rgba(  0%, 20%, 99%, .40) 10%, 
							rgba(  0%, 99%, 30%, .30),
							rgba( 99%, 90%, 20%, .30),
							rgba( 99%,  0%,  0%, .40)
						);
		}
	</style>
	
	<script src="/andromeda.js"></script>
	
	<script>
		window.addEventListener("load", async e => {
			
			// Check user information
			var location = "/service-me"
			var response = await fetch(location)
			var detail   = await response.json()
			console.log(detail)
			if (detail.result == "OK") {
				// TODO: display user detail from and app
			}
			if (detail.result != "OK") {
				// TODO: ask user to login, and exit from this subprogram
				// await Screen.createDialog("Invalid User")
				console.log("Invalid User")
			}
			
			window.user = detail
			
			// Screen.registerApp("Empty",     createEmptyApp    )
			// Screen.registerApp("Sample",    createSampleApp   )
			
			Screen.registerApp("Photo Viewer", createPhotoViewer )
			Screen.registerApp("Currency",     createCurrency    )
			Screen.registerApp("Text Editor",  e => App.createTextEditor(e) )
			Screen.registerApp("Memo",         e => App.createMemoApp(e)    )
			Screen.registerApp("File Manager", App.createFileManager )

			Screen.setDataType("Text Editor",  "text/plain")
			Screen.setDataType("Photo Viewer", "image/jpg" )
			Screen.setDataType("Photo Viewer", "image/jpeg")
			Screen.setDataType("Photo Viewer", "image/png" )
			
			Screen.setExtension("Text Editor", "js")
			Screen.setExtension("Memo",        "memo")
			
			Screen.setIcon("Text Editor",  Icon.documentIcon)
			Screen.setIcon("Photo Viewer", Icon.photoIcon)
			Screen.setIcon("Currency",     Icon.signalIcon)
			Screen.setIcon("Memo",         Icon.drawingIcon)
			Screen.setIcon("File Manager", Icon.folderIcon)	
		})
		
		function createEmptyApp() {
			var main = Screen.createWindow("Minimal")
		}
		
		function createPhotoViewer(file) {
			var viewer = Screen.createWindow("Photo Viewer")
			var container = viewer.element.querySelector(".container")
			container.style.padding = 0
			container.style.height = "calc(100% - 2rem)"

			var image = document.createElement("img")
			image.style.display = "block"
			image.style.width   = "100%"

			Screen.addElement(viewer, image)

			if (file instanceof File) {
				var reader = new FileReader()
				reader.onload = function() {

					image.onload = function() {
						console.log(image.height)

						var viewerHeight = viewer.element.clientHeight
						console.log("viewerHeight " + viewerHeight)
						if (viewerHeight > image.height) {
							var value = "calc(" + image.height + "px " +
											"+ 2rem)"
							console.log(value)
							viewer.element.style.height = value
						}
					}
					image.src = reader.result
					Screen.addElement(viewer, image)
				}
				reader.readAsDataURL(file)
			}
		}
		
		function createCurrency() {
			var main = Screen.createWindow("Currencies")
			var container = main.element.querySelector(".container")
			container.classList.add("cryptocurrency")
			
			var css = `
						.cryptocurrency .list {
							padding: .25rem 0;
							border-bottom: .25rem solid #f8f8f8;
							font-family: roboto-mono, monospace;
							font-size: 1.5rem;
						}
						.cryptocurrency .light {
							color: #bbb;
							margin-left: 4rem;
						}
					`

			Screen.addStyle(css)
			
			var items = ["BTC-USD", "ETH-USD", "XAU-USD",
						"GBP-USD", "EUR-USD", "USD-JPY", 
						"USD-CHF", "USD-CAD", "AUD-USD",
						"USD-THB"]
			
			for (var i = 0; i < items.length; i++) {
				var list = document.createElement("section")
				list.classList.add("list")
				list.classList.add(items[i])
				list.innerHTML = items[i]
				
				var location = "https://api.coinbase.com" +
								"/v2/prices/" + items[i] + "/spot"
				fetch(location).then( e => e.json() ).then(e => {
					// console.log(e)
					var symbol   = e.data.base + "-" + e.data.currency
					var selector = "." + symbol
					var element  = container.querySelector(selector)
					var value    = (+e.data.amount).toFixed(2)
					element.innerHTML = symbol +
										"<span class='light'>" +
										value +
										"</span>"
				})

				Screen.addElement(main, list)
			}
		}
		
		function createSampleApp() {
			var main = Screen.createWindow("Sample")
			var button = document.createElement("button")
			button.innerText = "Test"
			button.addEventListener("click", testDialog)
			Screen.addElement(main, button)
		}
		
		async function testDialog(e) {
			console.log(e)
			var result = await Screen.createDialog("Hello World")
			console.log("result = " + result)
		}
		
	</script>
</html>
