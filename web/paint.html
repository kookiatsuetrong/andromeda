	<style>
		html {
			margin: 0;
			padding: 0;
		}
		body {
			margin: 0;
			padding: 0;
		}
		#canvas {
			border-radius: 1rem;
			box-shadow: 0 0 .1rem black;
			touch-action: none;
			user-select: none;
			display: block;
			padding: 0;
			margin: 0;
			margin: 1rem auto;
		}
	</style>

	<script>
	var canvas = document.getElementById("canvas")
	var ctx = canvas.getContext("2d")

	canvas.addEventListener("pointerdown", handleStart)
	canvas.addEventListener("pointermove", handleMove)
	canvas.addEventListener("pointerup",   handleFinish)
	
	window.addEventListener("selectstart", e => {
		e.preventDefault()
	})

	var points = [ ]

	function handleStart(event) {
		// console.log(event)
		// console.log(event.pointerType)  // pen, mouse, touch
		// console.log(event.pressure)

		// try event.tiltX, event.tiltY
		// try event.pressure
		
		// event.preventDefault()
		// event.stopPropagation()

		if (event.pointerType == "pen") {
			canvas.setPointerCapture(event.pointerId)
			// var bound = canvas.getBoundingClientRect()
			var p = { }
			p.x = event.offsetX
			p.y = event.offsetY
			points.push(p)
			
			ctx.beginPath()
			ctx.arc(p.x, p.y, 5 * event.pressure, 0, 2 * Math.PI, false)
			ctx.fillStyle = "rgba(99%, 10%, 10%, 0.75)"
			ctx.fill()
		}
	}

	function handleMove(event) {
			
		// event.preventDefault()
		// event.stopPropagation()
		
		if (event.pointerType == "pen" && points.length > 0) {
			// var bound = canvas.getBoundingClientRect()
			var p = { }
			p.x = event.offsetX
			p.y = event.offsetY
			var last = points[points.length - 1]

			ctx.beginPath()
			ctx.moveTo(last.x, last.y)
			ctx.lineTo(p.x, p.y)
			ctx.lineWidth = 5 * event.pressure
			ctx.strokeStyle = "rgba(99%, 10%, 10%, 0.75)"
			ctx.stroke()

			points.push(p)
		}
	}
	
	function handleFinish(event) {
		
		// event.preventDefault()
		// event.stopPropagation()
		
		if (event.pointerType == "pen") {
			canvas.releasePointerCapture(event.pointerId)
			// canvas.style.touchAction = "auto"
			points = [ ]
			// document.body.style.userSelect = "auto"
		}
		
		if (window.getSelection()) {
			window.getSelection().removeAllRanges()
		}
	}

	</script>
