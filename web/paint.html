		</p>

		<canvas id="canvas" width="720" height="480">
			Your browser does not support the canvas element.
		</canvas>

		<a href="javascript:download()" class="download">Download</a>

		<p>
			This is a sample text.
		</p>

	<style>
		html {
			margin: 0;
			padding: 0;
		}
		body {
			margin: 0;
			padding: 0;
		}
		#canvas {
			border-radius: 1rem;
			box-shadow: 0 0 .1rem black;
			touch-action: none;
			user-select: none;
			display: block;
			padding: 0;
			margin: 0 auto;
		}
	</style>

	<script>
	var canvas = document.getElementById("canvas")
	var ctx = canvas.getContext("2d")

	canvas.addEventListener("pointerdown", handleStart)
	canvas.addEventListener("pointermove", handleMove)
	canvas.addEventListener("pointerup",   handleFinish)
	// canvas.addEventListener("touchmove",   handleClear)
	
	canvas.addEventListener("contextmenu",   e => e.preventDefault() )

	var points = [ ]

	function handleStart(event) {
		// console.log(event)
		// console.log(event.pointerType)  // pen, mouse, touch
		// console.log(event.pressure)

		// try event.tiltX, event.tiltY
		// try event.pressure
		
		// event.preventDefault()
		// event.stopPropagation()

		if (event.pointerType == "pen") {
			event.preventDefault()
			// canvas.setPointerCapture(event.pointerId)
			// var bound = canvas.getBoundingClientRect()
			
			if (event.pressure >= 0.05) {
				var width = 3.25 * event.pressure
				if (width <= 1) width = 1
				
				var p = { }
				p.x = event.offsetX
				p.y = event.offsetY
				points.push(p)
		   }
		}
	}

	function handleMove(event) {
		
		// event.preventDefault()
		// event.stopPropagation()
		
		if (event.pointerType == "pen") {
			event.preventDefault()
			// var bound = canvas.getBoundingClientRect()
			
			if (event.pressure > 0.05) {
				var p = { }
				p.x = event.offsetX
				p.y = event.offsetY
				points.push(p)
				
				if (points.length > 1) {
					var last = points[points.length - 2]
					ctx.beginPath()
					ctx.moveTo(last.x, last.y)
					ctx.lineTo(p.x, p.y)
					ctx.lineWidth = 4.0 * event.pressure
					ctx.strokeStyle = "rgba(10%, 10%, 99%, 0.75)"
					ctx.stroke()
				}
			}
		}
	}
	
	function handleFinish(event) {
		
		// event.preventDefault()
		// event.stopPropagation()
		
		if (event.pointerType == "pen") {
			event.preventDefault()
			// canvas.releasePointerCapture(event.pointerId)
			
			if (points.length == 1) {
				var p = points[0]
				var width = 2.75
				ctx.beginPath()
				ctx.arc(p.x, p.y, width, 0, 2 * Math.PI)
				ctx.fillStyle = "rgba(10%, 10%, 99%, 0.75)"
				ctx.fill()
			}
			points = [ ]
		}
		
		if (window.getSelection()) {
			window.getSelection().removeAllRanges()
		}
	}
	
	/*
	function handleClear(event) {
		console.log(event)
		var t = event.touches[0]
		// ctx.beginPath()
		ctx.clearRect(t.clientX - 20, t.clientY - 20, 40, 40)
		// ctx.clearRect(t.pageX - 32, t.pageY - 32, 64, 64)
		// ctx.fill()
	}
	*/
	
	function save() {
		var result = canvas.toDataURL("image/png")
		console.log(result)
		var image = document.createElement("img")
		image.src = result
		document.body.appendChild(image)
	}
	
	function download() {
		var link = document.createElement("a")
		link.download = "sample.png"
		link.href = canvas.toDataURL("image/png")
		link.click()
	}

	</script>

</html>
